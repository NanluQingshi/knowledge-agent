[tool.poetry]
name = "knowledge-agent"
version = "0.1.0"
description = "知识沉淀 Agent — 多源采集 + LLM 结构化抽取 + 混合存储 + 多 Agent 协作 + 持久化记忆"
authors = ["NanluQingshi"]
readme = "README.md"
packages = [{include = "knowledge_agent"}]

[tool.poetry.scripts]
ka = "knowledge_agent.cli:main"

[tool.poetry.dependencies]
python = "^3.11"
chromadb = "^0.5.0"
openai = "^1.50.0"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.0"}
pypdf = "^5.0.0"
unstructured = {version = ">=0.10.0", optional = true}
tiktoken = "^0.7.0"
rank-bm25 = "^0.2.2"
sentence-transformers = "^3.1.0"
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"
click = "^8.1.0"
rich = "^13.8.0"
networkx = "^3.3.0"
python-louvain = "^0.16.0"
numpy = ">=1.26.0"
gradio = "^5.0.0"

# Evaluation (optional)
ragas = {version = "^0.2.0", optional = true}
datasets = {version = "^3.0.0", optional = true}

[tool.poetry.extras]
eval = ["ragas", "datasets"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
